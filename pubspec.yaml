name: skxtrade_mobile
description: SKX Trade Android companion for the authenticated Windows trading engine.
publish_to: none
version: 1.2.4+2007
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^11.2.0
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  file_picker: ^13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/openalgo/
    - assets/chart.html
    - assets/lightweight-charts.js
    - assets/CHART_LICENSE.txt
    - assets/fonts/OFL.txt

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
