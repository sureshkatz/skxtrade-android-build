name: Build SKXTRADE APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate self-signed keystore if not provided
        run: |
          if [ ! -f "android/key.properties" ]; then
            echo "Generating self-signed keystore..."
            keytool -genkey -v -keystore android/app/upload-keystore.jks -alias skxtrade -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=SKXTRADE, OU=Dev, O=SKX, L=City, S=State, C=US"
            cat <<EOF > android/key.properties
          storeFile=upload-keystore.jks
          storePassword=password123
          keyAlias=skxtrade
          keyPassword=password123
          EOF
          fi

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release || true

      - name: Rename APKs for clarity
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/SKXTRADE-1.2.1-debug.apk || true
          cp build/app/outputs/flutter-apk/app-release.apk dist/SKXTRADE-1.2.1-release.apk || true

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SKXTRADE-APK
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: "SKX TRADE 1.2.1 Android APK"
          body: |
            Automated Android build of SKXTRADE mobile companion.
            - `SKXTRADE-1.2.1-release.apk`: Production release APK
            - `SKXTRADE-1.2.1-debug.apk`: Debug APK
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
