<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>html,body,#chart{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui}#error{position:absolute;bottom:54px;left:8px;right:8px;background:#fff1f2;color:#a32642;font-size:11px;border-radius:8px;padding:8px;display:none}.oac-mobile__header,.oac-topbar{display:none!important}.oac-widget{border:0!important;border-radius:0!important}</style></head><body><div id="chart"></div><div id="error"></div><script>/*OPENALGO_CORE*/</script><script>/*OPENALGO_INDICATORS*/</script><script>/*OPENALGO_DRAW*/</script><script>/*OPENALGO_WIDGET*/</script><script>
'use strict';let widget,config={},docs={},drawingsLoaded=false,seq=0,overlays=[],nativeUpdating=false,markerLayer,markerSeries;const pending=new Map(),dirty=new Map();
function rpc(type,payload={}){const id=++seq;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Chart request timed out'))},45000);pending.set(id,{resolve,reject,timer});ChartBridge.postMessage(JSON.stringify({id,type,...payload}));});}
window.chartReply=(id,value,error)=>{const p=pending.get(id);if(!p)return;clearTimeout(p.timer);pending.delete(id);error?p.reject(new Error(error)):p.resolve(value);};
function error(e){const el=document.getElementById('error');el.textContent=e?.message||String(e);el.style.display='block';}
const tfs={'1m':'M1','3m':'M3','5m':'M5','10m':'M10','15m':'M15','30m':'M30','45m':'M45','1h':'H1','4h':'H4','1d':'D1'};function interval(tf){return Object.keys(tfs).find(k=>tfs[k]===tf)||'30m';}
function bars(raw){return (Array.isArray(raw)?raw:raw?.bars||raw?.data||[]).map(b=>({...b,time:Number(b.time)>1e11?Math.floor(Number(b.time)/1000):Number(b.time),volume:Number(b.volume??b.tick_volume??0)})).filter(b=>Number.isFinite(b.time)).sort((a,b)=>a.time-b.time);}
let saveTimer;function save(key,document,remove=false){if(!drawingsLoaded)return false;dirty.set(key,{document,remove});clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);return true;}
async function flush(){for(const [key,item] of [...dirty]){try{await rpc('drawingSave',{key,...item});if(dirty.get(key)===item)dirty.delete(key);}catch(e){error(new Error('Drawing save failed; retrying. '+e.message));saveTimer=setTimeout(flush,5000);}}}
const drawingStore={get:k=>docs[k]??null,set:(k,d)=>{docs[k]=d;return save(k,d);},remove:k=>{delete docs[k];save(k,null,true);}};
async function start(cfg){config=cfg;try{const r=await rpc('drawings');docs=r?.documents||{};drawingsLoaded=true;}catch(e){error(new Error('Saved drawings unavailable. Changes will not overwrite server drawings.'));}
try{const lib=OpenAlgoCharts;const register=lib.registerBuiltinIndicators||lib.indicators?.registerBuiltinIndicators||lib.widget?.registerBuiltinIndicators;if(register)register.call(lib);
widget=lib.widget.createWidget(document.getElementById('chart'),{symbol:cfg.symbol,exchange:'MT5',interval:interval(cfg.tf),intervals:Object.keys(tfs),topbar:false,theme:cfg.dark?'dark':'light',mobile:'auto',persist:false,chartType:cfg.chartType==='candles'?'candlestick':cfg.chartType,indicators:true,drawingScope:'instrument',drawingStore,
feed:{getBars:async req=>{const data=await rpc('bars',{symbol:req.symbol||config.symbol,tf:tfs[req.interval]||config.tf,from:req.from,to:req.to});document.getElementById('error').style.display='none';return bars(data);}},symbolSearch:async q=>(config.symbols||[]).filter(s=>s.toLowerCase().includes(q.toLowerCase())).slice(0,100).map(s=>({symbol:s,exchange:'MT5',name:s}))});
widget.on?.('symbol',e=>!nativeUpdating&&ChartBridge.postMessage(JSON.stringify({type:'market',symbol:e.symbol,tf:tfs[widget.interval()]||config.tf})));widget.on?.('interval',e=>!nativeUpdating&&ChartBridge.postMessage(JSON.stringify({type:'market',symbol:widget.symbol(),tf:tfs[e.interval]||config.tf})));
}catch(e){error(e);}}
window.chartConfig=cfg=>{if(!widget){if(!window.starting){window.starting=true;start(cfg);}return;}const changed=cfg.symbol!==config.symbol||cfg.tf!==config.tf;nativeUpdating=true;if(changed)strategyResult({},'');config=cfg;if(widget.symbol()!==cfg.symbol)widget.setSymbol(cfg.symbol,'MT5');if(widget.interval()!==interval(cfg.tf))widget.setInterval(interval(cfg.tf));widget.setChartType(cfg.chartType==='candles'?'candlestick':cfg.chartType);widget.setTheme(cfg.dark?'dark':'light');if(!changed&&cfg.data?.length){const current=widget.chart.primaryBars(),last=current[current.length-1]?.time;for(const b of bars(cfg.data).slice(-3))if(last===undefined||b.time>=last)try{widget.series.update(b);}catch(e){error(e);}}nativeUpdating=false;};
window.chartAction=name=>{if(!widget)return;if(name==='indicators')widget.openIndicatorPicker();if(name==='settings')widget.openSettings();if(name==='objects')widget.openObjects();if(name==='reload')widget.reload();};
window.strategyResult=(result,key)=>{if(!widget)return;for(const s of overlays)widget.chart.removeSeries(s);overlays=[];for(const p of result.plots||[]){const data=(p.data||[]).map(x=>x.value==null?{time:Number(x.time)}:{time:Number(x.time),value:Number(x.value)});if(!data.some(x=>Number.isFinite(x.value)))continue;const s=widget.chart.addSeries('line',{title:p.title||'Pine',color:p.color||'#536bf4',lineWidth:2,priceLineVisible:false,...(p.pane==='pane'?{paneIndex:1}:{})});s.setData(data);overlays.push(s);}
const sec=v=>{if(v==null||v==='')return NaN;const n=Number(v);if(Number.isFinite(n))return n>1e11?Math.floor(n/1000):n;const text=String(v).trim();return Date.parse(/(?:Z|[+-]\d\d:\d\d)$/.test(text)?text:text.replace(' ','T')+'Z')/1000;};
const marks=(result.markers||[]).map(m=>({time:sec(m.time),position:m.position==='belowBar'?'belowBar':m.position==='atPrice'?'atPrice':'aboveBar',price:m.price!=null&&Number.isFinite(Number(m.price))?Number(m.price):undefined,color:String(m.color||'#009a7b'),shape:['arrowDown','arrowUp','circle'].includes(m.shape)?m.shape:'text',text:String(m.text||''),size:'small'}));
for(const t of [...(result.report?.trades||[]),...(result.report?.openTrades||[])]){const short=/short|sell/i.test(String(t.side??t.type??''))||Number(t.dir??t.direction)<0,et=sec(t.entry_time??t.entryTime),xt=sec(t.exit_time??t.exitTime);if(Number.isFinite(et))marks.push({time:et,position:short?'aboveBar':'belowBar',shape:short?'arrowDown':'arrowUp',text:short?'SELL':'BUY',color:short?'#d6425b':'#009a7b',size:'small'});if(Number.isFinite(xt))marks.push({time:xt,position:short?'belowBar':'aboveBar',shape:'circle',text:'Exit',color:'#8b5bd5',size:'small'});}
if(markerSeries!==widget.series){markerLayer=widget.series.createMarkers(()=>widget.chart.primaryBars());markerSeries=widget.series;}markerLayer.setMarkers(marks.filter(m=>Number.isFinite(m.time)).sort((a,b)=>a.time-b.time));};window.addEventListener('pagehide',flush);ChartBridge.postMessage(JSON.stringify({type:'ready'}));
</script></body></html>
