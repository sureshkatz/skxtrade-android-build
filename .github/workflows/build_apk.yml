name: Build SKXTRADE APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: actions/setup-flutter@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate self-signed keystore if not provided
        run: |
          if [ ! -f "android/key.properties" ]; then
            echo "Generating self-signed keystore..."
            keytool -genkey -v -keystore android/app/upload-keystore.jks -alias skxtrade -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=SKXTRADE, OU=Dev, O=SKX, L=City, S=State, C=US"
            cat <<EOF > android/key.properties
          storeFile=upload-keystore.jks
          storePassword=password123
          keyAlias=skxtrade
          keyPassword=password123
          EOF
          fi

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release || true

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SKXTRADE-APK
          path: build/app/outputs/flutter-apk/*.apk
